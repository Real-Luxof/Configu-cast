plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation("net.fabricmc:fabric-language-kotlin:$fabric_language_kotlin")
	modImplementation("at.petra-k.hexcasting:hexcasting-fabric-$minecraft_version:$hexcasting") {
		exclude module: "phosphor"
		exclude module: "lithium"
		exclude module: "emi"
	}
	modImplementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli-FABRIC-SNAPSHOT")
	modImplementation("at.petra-k.paucal:paucal-fabric-$minecraft_version:$paucal")
	modImplementation("com.samsthenerd.inline:inline-fabric:$minecraft_version-$inline")
	modLocalRuntime("io.github.tropheusj:serialization-hooks:0.4.99999")

    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:$cca"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:$cca"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-item:$cca"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-block:$cca"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
